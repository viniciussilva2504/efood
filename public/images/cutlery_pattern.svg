<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cutlery" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Garfo simples -->
      <g fill="#E66767" fill-opacity="0.04">
        <rect x="20" y="20" width="1" height="15"/>
        <rect x="22" y="20" width="1" height="15"/>
        <rect x="24" y="20" width="1" height="15"/>
        <rect x="26" y="20" width="1" height="15"/>
        <rect x="19" y="35" width="9" height="25"/>
      </g>
      
      <!-- Faca simples -->
      <g fill="#E66767" fill-opacity="0.04">
        <rect x="50" y="20" width="6" height="2"/>
        <rect x="52" y="22" width="2" height="25"/>
        <rect x="50" y="47" width="6" height="2"/>
      </g>
      
      <!-- Garfo deslocado -->
      <g fill="#E66767" fill-opacity="0.03">
        <rect x="70" y="60" width="1" height="12"/>
        <rect x="72" y="60" width="1" height="12"/>
        <rect x="74" y="60" width="1" height="12"/>
        <rect x="76" y="60" width="1" height="12"/>
        <rect x="69" y="72" width="9" height="20"/>
      </g>
      
      <!-- Faca deslocada -->
      <g fill="#E66767" fill-opacity="0.03">
        <rect x="10" y="70" width="5" height="2"/>
        <rect x="12" y="72" width="1" height="20"/>
        <rect x="10" y="92" width="5" height="2"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="100" height="100" fill="url(#cutlery)"/>
</svg>